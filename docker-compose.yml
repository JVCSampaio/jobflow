services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: jobflow
      POSTGRES_DB: jobflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=jobflow;Username=jobflow;Password=jobflow
      JWT_SIGNING_KEY: change-me-in-production-32-bytes-minimum
      RUN_MIGRATIONS_ON_STARTUP: "true"
      ENABLE_SWAGGER: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
